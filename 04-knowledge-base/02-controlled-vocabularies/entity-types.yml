schema_version: 1.0.0
vocabulary: entity_types
principle: 实体表示可被识别、消歧和跨文献连接的对象；观点和关系不作为实体属性直接固化。

types:
  - id: person
    label_zh: 人物
    examples: [设计师, 理论家, 作者, 编辑, 译者, 委托人, 工匠]

  - id: collective
    label_zh: 团体
    examples: [设计团体, 艺术小组, 合作网络, 社群]

  - id: institution
    label_zh: 机构
    examples: [学校, 博物馆, 档案馆, 协会, 政府机构, 研究中心]

  - id: company
    label_zh: 企业与品牌
    examples: [制造商, 出版社, 设计事务所, 品牌, 平台]

  - id: movement
    label_zh: 运动
    examples: [工艺美术运动, 现代主义运动, 构成主义]

  - id: style
    label_zh: 风格与形式范畴
    examples: [Art Deco, International Typographic Style, punk graphic style]

  - id: work
    label_zh: 作品
    examples: [海报, 书籍, 字体, 建筑, 展览设计, 数字界面]

  - id: product
    label_zh: 产品与人工物
    examples: [家具, 家电, 交通工具, 工具, 日用品]

  - id: publication
    label_zh: 出版物作品
    examples: [专著, 论文, 期刊, 图录, 宣言, 书评]

  - id: edition
    label_zh: 具体版本
    examples: [初版, 修订版, 再版, 数字版, OCR版本]

  - id: translation
    label_zh: 译本
    examples: [中文译本, 英译本, 节译本]

  - id: event
    label_zh: 事件
    examples: [成立, 展览, 会议, 出版, 迁移, 政策变化, 战争]

  - id: exhibition
    label_zh: 展览与博览会
    examples: [世界博览会, 设计展, 博物馆专题展]

  - id: place
    label_zh: 地点
    examples: [国家, 城市, 建筑, 街区, 区域]

  - id: period
    label_zh: 时期与分期
    examples: [战间期, 战后时期, 18世纪, 数字时代]

  - id: material
    label_zh: 材料
    examples: [木材, 钢, 塑料, 纸, 纺织品, 像素数据]

  - id: technology
    label_zh: 技术
    examples: [石版印刷, 摄影, 标准化生产, 网络技术, 生成式AI]

  - id: medium
    label_zh: 媒介
    examples: [印刷, 摄影, 广播, 展览, 网页, 移动界面]

  - id: concept
    label_zh: 概念
    examples: [现代性, 工艺, 标准化, 用户经验, 殖民性]

  - id: method
    label_zh: 研究方法
    examples: [形式分析, 物质文化研究, 文献计量, 网络分析]

  - id: law_policy_standard
    label_zh: 法律、政策与标准
    examples: [版权政策, 工业标准, 教育制度, 行业规范]

  - id: dataset_archive
    label_zh: 数据集与档案集合
    examples: [馆藏, 图像数据库, 企业档案, 口述史集合]

identity_rules:
  person:
    minimum_matching_fields: 2
    preferred_fields: [original_name, birth_death, affiliation, authored_work]
  institution:
    minimum_matching_fields: 2
    preferred_fields: [official_name, place, active_period, predecessor_successor]
  work:
    minimum_matching_fields: 2
    preferred_fields: [title, creator, date, medium, collection]
  edition:
    minimum_matching_fields: 3
    preferred_fields: [title, publisher, publication_year, isbn, translator]

rules:
  - 人物与人物在某一文献中的观点必须分开。
  - 机构在不同历史阶段的名称和职能变化应通过事件和时间范围表达。
  - movement与style不得因日常语言混用而自动合并。
  - publication表示抽象著作或出版物作品，edition表示具体版本。
  - translation必须连接其所翻译的具体edition，而不只连接抽象题名。
  - 无法消歧的对象保持candidate状态，不得强制合并。